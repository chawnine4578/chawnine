{t:'12. สุขภาพช่องปาก : คำถาม',i:[R('o1','12.1 ท่านมีความยากลำบากในการเคี้ยวอาหารแข็งหรือไม่',MM),R('o2','12.2 ท่านมีอาการเจ็บปวดในช่องปากหรือไม่',MM),R('o3','12.3 มีฟัน/รากฟันผุที่ไม่สามารถรักษาหรือป้องกันได้',MM),R('o4','12.4 มีเหงือกบวม ฝีหนอง ฟันโยก',MM),R('o5','12.5 จำนวนฟันแท้น้อยกว่าเกณฑ์ (อย่างน้อย 20 ซี่หรือ 4 คู่สบ)',YN.slice().reverse()),R('o6','12.6 ปัญหาเนื้อเยื่อช่องปาก: มีก้อนรอยแดงรอยขาว แผลเรื้อรัง นานกว่า 2 สัปดาห์',MM),R('o7','12.7 ปัญหาปากแห้ง น้ำลายแห้ง : ต้องดื่มน้ำตามเพื่อช่วยกลืนบ่อยครั้ง/มีอาการลิ้นแห้งติดเพดานบ่อย',MM),R('o8','12.8 สภาพช่องปาก (Oral Hygiene)',['สะอาด','ไม่สะอาด']),I('ข้อ 12.1-12.2 ไม่มีอาการทั้ง 2 ข้อ : ปกติ · มีอาการอย่างน้อย 1 ข้อ : มีความเสี่ยงต่อปัญหาสุขภาพช่องปากให้ทันตบุคลากรประเมินสุขภาพช่องปากต่อ · ข้อ 12.3-12.7 ถ้าประเมินว่า “มี” หรือ “ใช่” ≥ 1 ข้อ ควรส่งต่อเพื่อรับบริการทางทันตกรรมกับทันตบุคลากร · ข้อ 12.8 ถ้า “ไม่สะอาด” ควรฝึกการแปรงฟันและใช้อุปกรณ์เสริมเพื่อควบคุมคราบจุลินทรีย์')]},

{t:'ผู้ทำการคัดกรอง',i:[T('scr_by','ลงชื่อ ผู้ทำการคัดกรอง'),T('scr_com','ทำการคัดกรอง ชุมชน'),D('scr_date','วันที่')]}];
function item(it){const o=(it.o||[]).map(x=>typeof x==='string'?[x,x]:x);
if(it.k==='r')return`<div class="q">${it.l?`<div class="ql">${it.l}</div>`:''}<div class="opts">${o.map(([v,t])=>`<label class="ch"><input type="radio" name="${it.n}" value="${esc(v)}"><span>${t}</span></label>`).join('')}</div></div>`;
if(it.k==='c')return`<div class="q"><div class="opts"><span class="ql" style="margin:0;align-self:center">${it.l}</span>${o.map(([v,t])=>`<label class="ch"><input type="checkbox" name="${it.n}" value="${esc(v)}"><span>${t}</span></label>`).join('')}</div></div>`;
if(it.k==='n')return`<div class="q row"><label class="ql" for="${it.n}">${it.l}</label><span class="nu"><input id="${it.n}" name="${it.n}" type="number" step="any" inputmode="decimal" min="0"><em>${it.u||''}</em></span></div>`;
if(it.k==='t'||it.k==='d')return`<div class="q row"><label class="ql" for="${it.n}">${it.l}</label><span class="nu"><input id="${it.n}" name="${it.n}" type="${it.k==='d'?'date':'text'}"></span></div>`;

CV.onpointermove=e=>{if(!dr)return;const[x,y]=pt(e);cx.lineTo(x,y);cx.stroke()};
CV.onpointerup=CV.onpointercancel=()=>{if(!dr)return;dr=false;S.clk=CV.toDataURL('image/png');S.dirty=true;stat()}}
let WR=null;
document.addEventListener('pointerdown',e=>{const l=e.target.closest&&e.target.closest('#sf .ch'),r=l&&l.querySelector('input[type=radio]');WR=r&&r.checked?r:null},true);
document.addEventListener('click',e=>{if(WR&&e.target===WR){WR.checked=false;WR.dispatchEvent(new Event('input',{bubbles:true}));WR=null}},true);
/* ---------- ส่งออก PDF ---------- */
const bx=on=>`<i class='bx${on?' on':''}'></i>`;
function repItem(it,d,p){const v=d[it.n],o=(it.o||[]).map(x=>typeof x==='string'?[x,x]:x);
if(it.k==='r')return`<div class='rq'>${it.l?`<b>${it.l}</b><br>`:''}${o.map(([val,t])=>`<span class='ro${v===val?' on':''}'>${bx(v===val)}${t}</span>`).join('')}</div>`;
if(it.k==='c'){const a=d[it.n]||[];return`<div class='rq'>${it.l}: ${o.map(([val,t])=>`<span class='ro${a.includes(val)?' on':''}'>${bx(a.includes(val))}${t}</span>`).join('')}</div>`}
if(it.k==='n')return`<div class='rq'>${it.l}${it.l?': ':''}<b>${v!=null?esc(v):'......'}</b> ${it.u||''}</div>`;
if(it.k==='t')return`<div class='rq'>${it.l}: <b>${esc(v)||'.........'}</b></div>`;
if(it.k==='d')return`<div class='rq'>${it.l}: <b>${v?fmtD(v):'.........'}</b></div>`;
if(it.k==='x'){let t='-';if(it.id==='osta_v'){const w=parseFloat(d.weight),a=parseFloat(p.age);if(!isNaN(w)&&!isNaN(a))t=(0.2*(w-a)).toFixed(1)}else if(it.id==='mc_v'){if(d.mc_w!=null&&d.mc_c!=null)t=(+d.mc_w + +d.mc_c)+' / 5'}else{const ks=[...Array(10)].map((_,i)=>'adl'+(i+1));if(ks.some(k=>d[k]!=null))t=ks.reduce((s,k)=>s+(+d[k]||0),0)+' / 20'}return`<div class='rq'><b>${it.l}: ${t}</b></div>`}
if(it.k==='cl')return clock_?`<div class='rq'><b>ภาพวาดนาฬิกา (ข้อ 6.2)</b><br><img src='${clock_}'></div>`:'';
return''}
let clock_=null;
function reportHTML(p,d){const f=k=>`<div>${PF.find(x=>x[0]===k)[1].replace(' *','')}: <b>${esc(p[k])||'-'}</b></div>`;
let h=`<div class='rb'><div class='rt'>แบบฟอร์มคัดกรองผู้สูงอายุ (Basic Geriatric Screening : BGS)<br>และการคัดกรองกลุ่มอาการของผู้สูงอายุ 9 ด้าน ปี 2569</div><div style='text-align:center'>หน่วยงาน <b>${esc(p.unit)||'.....'}</b> อำเภอ <b>${esc(p.unit_amp)||'.....'}</b> จังหวัดประจวบคีรีขันธ์</div></div>`;
h+=`<div class='rb'><div class='pg'>${['name','age','sex','nid','tel','addr','moo','tambon','amp','prov','ref_name','ref_rel'].map(f).join('')}</div></div>`;
SEC.forEach(s=>{if(s.g){h+=`<div class='rb rg'>${s.g}</div>`;return}h+=`<div class='rb'><div class='rh'>${s.t}</div>${s.i.map(it=>repItem(it,d,p)).join('')}</div>`});return h}
function reportHTML2(p,d){const u=v=>`<span class='u'>${esc(v)||'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'}</span>`;
let h=`<div class='rb'><div class='sx hd'><div class='rt' style='text-align:center'>แบบฟอร์มคัดกรองผู้สูงอายุ (Basic Geriatric Screening : BGS) และ<br>การคัดกรองกลุ่มอาการของผู้สูงอายุ 9 ด้าน ปี 2569</div>
<div class='hl'><b>หน่วยงาน</b>${u(p.unit)} <b>อำเภอ</b>${u(p.unit_amp)} <b>จังหวัด</b> ประจวบคีรีขันธ์</div>
<div class='hl'><b>ชื่อ-สกุล</b>${u(p.name)} <b>ว/ด/ป เกิด</b>${u(p.dob?fmtD(p.dob):'')} <b>อายุ</b>${u(p.age)} <b>ปี เพศ</b>${u(p.sex)}</div>
<div class='hl'><b>เลขบัตรประชาชน</b>${u(p.nid)} <b>เบอร์โทรศัพท์</b>${u(p.tel)} <b>ที่อยู่เลขที่</b>${u(p.addr)} <b>หมู่</b>${u(p.moo)}</div>
<div class='hl'><b>ตำบล</b>${u(p.tambon)} <b>อำเภอ</b>${u(p.amp)} <b>จังหวัด</b>${u(p.prov)}</div>
<div class='hl'><b>บุคคลอ้างอิง ชื่อ-สกุล</b>${u(p.ref_name)} <b>ความสัมพันธ์</b>${u(p.ref_rel)}</div></div></div>`;
const lf=['สูตร','6.1','7.1','ถามผู้สูงอายุ','วิธีการ','คำถาม','9.2'];
SEC.forEach(s=>{if(s.g){h+=`<div class='rb'><div class='sx gt'>${s.g}</div></div>`;return}
const L=[],Rn=[];s.i.forEach(it=>{if(it.k==='i'&&!lf.some(x=>it.l.startsWith(x)))Rn.push(it.l);else L.push(it)});
h+=`<div class='rb'><div class='sx'><div class='sl'><div class='rh'>${s.t}</div>${L.map(it=>it.k==='i'?`<div class='rn'>${it.l}</div>`:repItem(it,d,p)).join('')}</div>${Rn.length?`<div class='sr'><b>การแปลผล</b>${Rn.map(t=>`<div class='rn'>${t}</div>`).join('')}</div>`:''}</div></div>`});
h+=`<div class='rb'><div class='fn'><b>หมายเหตุ</b> : กลุ่มงานส่งเสริมสุขภาพ สำนักงานสาธารณสุขจังหวัดประจวบคีรีขันธ์ ปรับปรุงแก้ไข ตามคู่มือการคัดกรองและประเมินสุขภาพผู้สูงอายุ พ.ศ. 2564 กระทรวงสาธารณสุข และแบบประเมินการคัดกรองกลุ่มอาการของผู้สูงอายุ 9 ด้าน พ.ศ. 2566 ของกรมอนามัย เริ่มใช้ 1 ตุลาคม 2566</div></div>`;return h}
async function makePDF(pid,d,clock){const p=DB.people.find(x=>x.id===pid);if(!window.html2canvas||!window.jspdf)return toast('โหลดตัวสร้าง PDF ไม่สำเร็จ (ต้องต่ออินเทอร์เน็ต)');
clock_=clock;const host=document.createElement('div');host.className='rep';host.innerHTML=reportHTML2(p,d);document.body.appendChild(host);
try{await Promise.all([document.fonts.load('13px "Noto Sans Thai"','ก'),document.fonts.load('700 13px "Noto Sans Thai"','ก')]).catch(()=>{});await Promise.all([...host.querySelectorAll('img')].map(i=>i.decode().catch(()=>{})));
const pdf=new window.jspdf.jsPDF('p','mm','a4'),W=210,H=297,M=8;let y=M;
for(const el of host.querySelectorAll('.rb')){const c=await html2canvas(el,{scale:2,backgroundColor:'#fff'});const h=c.height*(W-2*M)/c.width;if(y+h>H-M&&y>M){pdf.addPage();y=M}pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',M,y,W-2*M,h);y+=h-.25}
const dl=window.claude&&await claude.use('downloads');if(!dl)return toast('มุมมองนี้ดาวน์โหลดไฟล์ไม่ได้ — เปิดหน้านี้ใน claude.ai แล้วลองใหม่');
await dl.save({filename:'BGS_'+(p.name||'person').replace(/\s+/g,'_')+'_'+isoToday()+'.pdf',data:pdf.output('blob')});toast('ส่งออก PDF เรียบร้อย')}
catch(x){if(!x||x.code!=='declined')toast('สร้าง PDF ไม่สำเร็จ ลองใหม่อีกครั้ง')}finally{host.remove()}}
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});
render();
</script></body></html>
